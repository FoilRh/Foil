<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm in Foil</title>
  <style>
    :root { color-scheme: dark; --bg: #08140f; --fg: #f4efe6; --muted: #a9b4ab; --accent: #f2c768; --line: rgba(244, 239, 230, 0.15); }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 4px; font-size: 18px; color: var(--accent); }
    .site { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
    .summary { border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 16px; margin-bottom: 14px; }
    p { color: var(--muted); font-size: 12px; }
    .row { display: flex; gap: 8px; margin-top: 16px; }
    button { flex: 1; min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-size: 14px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #1a1405; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Confirm in Foil</h1>
  <div class="site" id="site"></div>
  <div class="summary" id="summary"></div>
  <p>Only your current tin is involved. Foil checked this request against the allowed pack-site actions and blocks anything else.</p>
  <div class="row">
    <button id="reject" type="button">Reject</button>
    <button id="approve" class="primary" type="button">Approve</button>
  </div>
  <script src="confirm.js"></script>
</body>
</html>
