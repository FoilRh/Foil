name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment);
# downloaded binaries are checked against a sha256.
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - run: bun run lint:copy
      - run: bun run lint:privacy
      - run: bun run test:unit # e2e needs anvil and proving keys: the circuits job runs it
      - run: bun run typecheck
      - run: bun run lint
      - name: web build
        working-directory: apps/web
        run: cp .env.example .env && bun run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive, persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - working-directory: contracts
        run: forge test -vv
      - name: services against anvil
        run: bun test services
      - name: symbolic checks (Halmos 0.3.3, core fee math)
        working-directory: contracts
        env: { HALMOS_ALLOW_DOWNLOAD: "1" } # Halmos fetches its pinned bitwuzla build
        run: |
          pipx install halmos==0.3.3
          halmos --match-contract FormalTest --solver bitwuzla --solver-timeout-assertion 1800s

  circuits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive, persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.13 }
      - name: circom 2.1.9
        run: |
          curl -sSfL -o circom https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64
          echo "e5575829252d763b7818049df9de2ef9304df834697de77fa63ce7babc23c967  circom" | sha256sum -c -
          sudo install -m 0755 circom /usr/local/bin/circom && rm circom
      - run: bun install --frozen-lockfile
      - run: bun run test:circuits
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - name: dev setup + real-proof contract test
        run: |
          cd circuits && bun run setup:dev
          cd ../contracts && FOUNDRY_PROFILE=ffi forge test -vv
      - name: end-to-end over OHTTP with real proofs
        run: bun test --timeout 300000 e2e # real proofs on shared CI runners can take over 2 min per test

  rhc-fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive, persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - name: real USDG on a Robinhood Chain fork
        working-directory: contracts
        env: { RHC_RPC_URL: "https://rpc.mainnet.chain.robinhood.com" }
        run: FOUNDRY_PROFILE=fork forge test -vv

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks 8.30.1 over full history
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git --redact --exit-code 1 .

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - run: semgrep scan --config p/default --config p/github-actions --error --exclude contracts/lib

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { submodules: recursive, persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: contracts/
          slither-version: 0.11.6
          slither-config: contracts/slither.config.json # skips OpenZeppelin, generated verifiers, tests
          fail-on: high

  circomspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile # circomlib, included by relative path
      - run: cargo install circomspect --version 0.9.0 --locked
      - name: circomspect (warnings shown, errors fail)
        run: |
          circomspect --level WARNING circuits/src/*.circom || true
          circomspect --level ERROR circuits/src/*.circom
