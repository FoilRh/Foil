# fly deploy --config services/relayer/fly.toml (from the repo root)
# Secrets: fly secrets set RPC_URL=… POOL_ADDRESS=… RELAYER_PRIVATE_KEY=… INTERNAL_TOKEN=… (unique; the API holds it as RELAYER_TOKEN)
app = "foil-relayer"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile"
  [build.args]
    SERVICE = "relayer"

# Public HTTPS, but every route except /health needs this service's own bearer token
# (the API on Vercel is outside Fly's private network). CHAIN_ID is set per deploy.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
